name: Build

on:
  push:
    branches: [main, multi-artboard-lazy-loading]
  pull_request:
    branches: [main]
  # Lanzar a mano desde GitHub (Actions → Build → Run workflow), p.ej. para
  # obtener la extensión nativa de texto compilada para macOS y Windows.
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          echo "$PWD" >> $GITHUB_PATH

      - name: Validate project
        run: |
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 || true

  # Extensiones nativas: texto (VectorRichText) e importar/exportar (VectopenIO).
  # Una librería por sistema, en las rutas que esperan sus .gdextension. Sin
  # ellas Vectopen sigue funcionando (texto e importadores en GDScript).
  native:
    name: ${{ matrix.crate }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        crate: [vectopen_text, vectopen_io]
    defaults:
      run:
        shell: bash
        working-directory: rust/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Unit tests
        run: cargo test --locked

      - name: Build (Linux / Windows)
        if: runner.os != 'macOS'
        run: |
          cargo build --locked
          cargo build --locked --release

      # macOS: binario universal (Intel + Apple Silicon) en la ruta única que
      # usa el .gdextension para macos y macos.arm64.
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          for profile in debug release; do
            flag=$([ "$profile" = release ] && echo --release || true)
            cargo build --locked $flag --target x86_64-apple-darwin
            cargo build --locked $flag --target aarch64-apple-darwin
            mkdir -p target/$profile
            lipo -create \
              target/x86_64-apple-darwin/$profile/lib${{ matrix.crate }}.dylib \
              target/aarch64-apple-darwin/$profile/lib${{ matrix.crate }}.dylib \
              -output target/$profile/lib${{ matrix.crate }}.dylib
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.crate }}-${{ runner.os }}
          path: |
            rust/${{ matrix.crate }}/target/debug/*${{ matrix.crate }}.dll
            rust/${{ matrix.crate }}/target/release/*${{ matrix.crate }}.dll
            rust/${{ matrix.crate }}/target/debug/lib${{ matrix.crate }}.so
            rust/${{ matrix.crate }}/target/release/lib${{ matrix.crate }}.so
            rust/${{ matrix.crate }}/target/debug/lib${{ matrix.crate }}.dylib
            rust/${{ matrix.crate }}/target/release/lib${{ matrix.crate }}.dylib
          if-no-files-found: error
