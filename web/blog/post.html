<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

<script>
(function () {
  var slug = new URLSearchParams(location.search).get("p") || "";
  var bodyEl = document.getElementById("pbody");
  var metaEl = document.getElementById("pmeta");
  var tagsEl = document.getElementById("ptags");

  function fail() {
    var e = document.getElementById("err");
    if (e) { e.hidden = false; bodyEl.innerHTML = ""; bodyEl.appendChild(e); }
    document.dispatchEvent(new CustomEvent("vectopen:lang", { detail: { lang: (window.VECTOPEN_LANG ? window.VECTOPEN_LANG() : "en") } }));
  }
  if (!slug) return fail();

  var lang = window.VECTOPEN_LANG ? window.VECTOPEN_LANG() : "en";

  VectopenBlog.post(slug, "", lang).then(function (p) {
    var m = p.meta || {};
    var title = m.title || slug;
    document.title = title + " — Vectopen Blog";
    metaEl.textContent = VectopenBlog.fmtDate(m.date || "");
    var html = window.marked ? marked.parse(p.body, { gfm: true, breaks: false }) : ("<pre>" + VectopenBlog.esc(p.body) + "</pre>");
    bodyEl.innerHTML = "<h1>" + VectopenBlog.esc(title) + "</h1>" + html;
    var tags = Array.isArray(m.tags) ? m.tags : (m.tags ? [m.tags] : []);
    tagsEl.innerHTML = tags.map(function (t) { return "<span>" + VectopenBlog.esc(t) + "</span>"; }).join("");
  }).catch(fail);
})();
</script>
